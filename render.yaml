services:
  - type: web
    name: trasol-supportflow-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./trasol_supportdesk.db
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Trasol SupportDesk
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
