<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="depGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="depShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="40" y="45" fill="url(#depGrad)" font-size="24" font-weight="800">Production Deployment Topology</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Multi-Container Docker Compose Stack, Nginx Reverse Proxy, Redis Pub/Sub, PostgreSQL &amp; Cloud Gateway</text>

  <!-- External User Layer -->
  <g transform="translate(40, 110)">
    <rect width="880" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="30" y="40" fill="#f8fafc" font-size="14" font-weight="700">Client Traffic (Browsers &amp; Webhooks)</text>
    <text x="30" y="58" fill="#94a3b8" font-size="11">HTTPS (Port 443) / HTTP (Port 80) &amp; Secure WebSockets (WSS)</text>
    <circle cx="820" cy="35" r="16" fill="#38bdf8" opacity="0.2"/>
    <text x="820" y="40" fill="#38bdf8" font-size="12" text-anchor="middle">SSL</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 480 180 L 480 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="476,215 480,225 484,215" fill="#38bdf8"/>

  <!-- Docker Compose Boundary -->
  <rect x="40" y="230" width="880" height="280" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-dasharray="6"/>
  <rect x="40" y="230" width="220" height="28" rx="6" fill="#2563eb"/>
  <text x="50" y="249" fill="#ffffff" font-size="12" font-weight="700">DOCKER COMPOSE NETWORK</text>

  <!-- Container 1: Frontend Nginx -->
  <g transform="translate(70, 280)">
    <rect width="230" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="20" y="30" fill="#38bdf8" font-size="13" font-weight="700">trasol_frontend</text>
    <text x="20" y="50" fill="#f8fafc" font-size="11">Nginx 1.25 Alpine</text>
    <text x="20" y="70" fill="#94a3b8" font-size="11">Port 80:80 (Web Root)</text>
    <text x="20" y="90" fill="#64748b" font-size="10">Reverse proxy /api &amp; /ws</text>
  </g>

  <!-- Container 2: Backend FastAPI -->
  <g transform="translate(360, 280)">
    <rect width="250" height="110" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="20" y="30" fill="#818cf8" font-size="13" font-weight="700">trasol_backend</text>
    <text x="20" y="50" fill="#f8fafc" font-size="11">FastAPI / Uvicorn (Py 3.11)</text>
    <text x="20" y="70" fill="#94a3b8" font-size="11">Port 8000:8000 (Internal)</text>
    <text x="20" y="90" fill="#64748b" font-size="10">JWT, WebSockets, Outbox</text>
  </g>

  <!-- Arrow Frontend -> Backend -->
  <line x1="300" y1="335" x2="355" y2="335" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="350,331 360,335 350,339" fill="#38bdf8"/>

  <!-- Container 3: PostgreSQL -->
  <g transform="translate(670, 280)">
    <rect width="220" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="20" y="30" fill="#10b981" font-size="13" font-weight="700">trasol_postgres</text>
    <text x="20" y="50" fill="#f8fafc" font-size="11">PostgreSQL 16 Alpine</text>
    <text x="20" y="70" fill="#94a3b8" font-size="11">Port 5432:5432</text>
    <text x="20" y="88" fill="#64748b" font-size="10">Persistent named volume</text>
  </g>

  <!-- Arrow Backend -> DB -->
  <line x1="610" y1="330" x2="665" y2="330" stroke="#10b981" stroke-width="2"/>
  <polygon points="660,326 670,330 660,334" fill="#10b981"/>

  <!-- Container 4: Redis -->
  <g transform="translate(360, 410)">
    <rect width="250" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="20" y="28" fill="#ef4444" font-size="13" font-weight="700">trasol_redis</text>
    <text x="20" y="46" fill="#f8fafc" font-size="11">Redis 7 Alpine (Port 6379)</text>
    <text x="20" y="64" fill="#94a3b8" font-size="10">Pub/Sub Multi-Worker WS Broker</text>
  </g>

  <!-- Arrow Backend -> Redis -->
  <line x1="485" y1="390" x2="485" y2="405" stroke="#ef4444" stroke-width="2"/>
  <polygon points="481,400 485,410 489,400" fill="#ef4444"/>

  <!-- Container 5: Volume -->
  <g transform="translate(70, 410)">
    <rect width="230" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="2"/>
    <text x="20" y="28" fill="#cbd5e1" font-size="12" font-weight="600">Shared Volumes</text>
    <text x="20" y="46" fill="#94a3b8" font-size="10">backend_uploads (/app/uploads)</text>
    <text x="20" y="64" fill="#94a3b8" font-size="10">postgres_data &amp; redis_data</text>
  </g>

  <!-- External Brevo Cloud -->
  <g transform="translate(670, 400)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#depShadow)"/>
    <text x="20" y="28" fill="#f59e0b" font-size="13" font-weight="700">Brevo Cloud Gateway</text>
    <text x="20" y="48" fill="#f8fafc" font-size="11">HTTPS REST API v3</text>
    <text x="20" y="68" fill="#94a3b8" font-size="10">Real OTP &amp; Notification Emails</text>
  </g>

  <!-- Arrow Backend -> Brevo -->
  <path d="M 610 370 L 670 420" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3"/>
  <polygon points="665,414 675,424 661,421" fill="#f59e0b"/>

  <!-- Footer note -->
  <text x="480" y="560" fill="#64748b" font-size="12" text-anchor="middle">Run production stack with: docker-compose up -d --build | Monitored by container health checks</text>
</svg>
