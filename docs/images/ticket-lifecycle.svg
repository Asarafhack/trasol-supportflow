<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="40" y="45" fill="url(#titleGrad)" font-size="24" font-weight="800">Support Ticket Lifecycle &amp; State Transitions</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Enterprise SLA enforcement, automated dual notifications, real-time agent dispatch &amp; feedback</text>

  <!-- Node 1: Ticket Creation -->
  <g transform="translate(40, 140)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="30" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">1. Open</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">TKT-YYYY-000001</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">Dual Email Dispatched</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="180" x2="250" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="245,176 255,180 245,184" fill="#64748b"/>
  <text x="220" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">Assign</text>

  <!-- Node 2: Assigned -->
  <g transform="translate(255, 140)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="75" y="30" fill="#818cf8" font-size="14" font-weight="700" text-anchor="middle">2. Assigned</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Tier 1/2 Technician</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">Agent Alert &amp; WS Push</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="405" y1="180" x2="465" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,176 470,180 460,184" fill="#64748b"/>
  <text x="435" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">Investigate</text>

  <!-- Node 3: In Progress -->
  <g transform="translate(470, 140)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="75" y="30" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="middle">3. In Progress</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Diagnostics Active</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">Private Staff Notes</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="620" y1="180" x2="680" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="675,176 685,180 675,184" fill="#64748b"/>
  <text x="650" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">Solve</text>

  <!-- Node 4: Resolved -->
  <g transform="translate(685, 140)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="30" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle">4. Resolved</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Root Cause Addressed</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">Resolution Timestamp</text>
  </g>

  <!-- Node 5: Closed & Feedback -->
  <g transform="translate(685, 310)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <text x="75" y="30" fill="#059669" font-size="14" font-weight="700" text-anchor="middle">5. Closed</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Customer Feedback</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">1-5 Stars &amp; Review</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="760" y1="220" x2="760" y2="305" stroke="#10b981" stroke-width="2"/>
  <polygon points="756,300 760,310 764,300" fill="#10b981"/>
  <text x="790" y="265" fill="#94a3b8" font-size="9">Confirm &amp; Rate</text>

  <!-- Branch: Waiting for Customer -->
  <g transform="translate(470, 310)" filter="url(#nodeShadow)">
    <rect width="150" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="75" y="30" fill="#a855f7" font-size="12" font-weight="700" text-anchor="middle">Waiting for Customer</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Logs/Details Requested</text>
    <text x="75" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">Inbound Email Awaited</text>
  </g>

  <!-- Loop between 3 and Waiting for Customer -->
  <path d="M 520 220 L 520 305" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3"/>
  <polygon points="516,300 520,310 524,300" fill="#a855f7"/>
  <path d="M 570 310 L 570 225" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3"/>
  <polygon points="566,230 570,220 574,230" fill="#a855f7"/>
  <text x="545" y="270" fill="#c084fc" font-size="9" text-anchor="middle">Reply / Ingest</text>

  <!-- SLA Breach Alert Banner -->
  <rect x="40" y="330" width="365" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="355" fill="#fecaca" font-size="12" font-weight="700">SLA Breach &amp; Auto Escalation</text>
  <text x="60" y="373" fill="#fca5a5" font-size="10">If sla_deadline passes without resolution, automated tier-3 escalation triggers.</text>
</svg>
