<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boxClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="50" y="55" fill="url(#gradHeader)" font-size="28" font-weight="800" letter-spacing="-0.5">Trasol SupportFlow 360</text>
  <text x="50" y="82" fill="#94a3b8" font-size="14" font-weight="400">Enterprise High-Level System Architecture &amp; Component Interaction</text>

  <!-- LAYER 1: CLIENT TIER -->
  <rect x="50" y="110" width="900" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="110" width="180" height="28" rx="6" fill="#3b82f6" />
  <text x="62" y="129" fill="#ffffff" font-size="12" font-weight="700">1. CLIENT / PRESENTATION</text>

  <!-- Client Boxes -->
  <g transform="translate(70, 150)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="24" fill="#f8fafc" font-size="13" font-weight="600">Customer Portal</text>
    <text x="20" y="40" fill="#94a3b8" font-size="11">React, Vite, Tailwind</text>
  </g>
  <g transform="translate(280, 150)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="24" fill="#f8fafc" font-size="13" font-weight="600">Support Agent Desk</text>
    <text x="20" y="40" fill="#94a3b8" font-size="11">Real-time Chat, Staff Notes</text>
  </g>
  <g transform="translate(490, 150)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="24" fill="#f8fafc" font-size="13" font-weight="600">Operations Center</text>
    <text x="20" y="40" fill="#94a3b8" font-size="11">Executive Analytics, SLAs</text>
  </g>
  <g transform="translate(700, 150)">
    <rect width="230" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="18" y="24" fill="#f8fafc" font-size="13" font-weight="600">Inbound Mail Client</text>
    <text x="18" y="40" fill="#94a3b8" font-size="11">Direct Email Replies [TKT-XXXX]</text>
  </g>

  <!-- Connection Arrows Down -->
  <path d="M 160 220 L 160 255" stroke="#6366f1" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <path d="M 370 220 L 370 255" stroke="#6366f1" stroke-width="2" stroke-dasharray="4" />
  <path d="M 580 220 L 580 255" stroke="#6366f1" stroke-width="2" stroke-dasharray="4" />
  <path d="M 815 220 L 815 255" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />

  <!-- LAYER 2: API & GATEWAY TIER -->
  <rect x="50" y="260" width="900" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="260" width="180" height="28" rx="6" fill="#6366f1" />
  <text x="62" y="279" fill="#ffffff" font-size="12" font-weight="700">2. FASTAPI &amp; GATEWAY</text>

  <g transform="translate(70, 300)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">REST API Router</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">JWT Auth &amp; RBAC Guard</text>
  </g>
  <g transform="translate(280, 300)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">WebSocket Manager</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">/ws/notifications &amp; rooms</text>
  </g>
  <g transform="translate(490, 300)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Ticket Lifecycle Engine</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">Sequential TKT-YYYY-XXXX</text>
  </g>
  <g transform="translate(700, 300)">
    <rect width="230" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Inbound Webhook</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">Regex Parser &amp; Deduplication</text>
  </g>

  <!-- Connection Arrows Down -->
  <path d="M 160 370 L 160 405" stroke="#06b6d4" stroke-width="2" />
  <path d="M 370 370 L 370 405" stroke="#06b6d4" stroke-width="2" />
  <path d="M 580 370 L 580 405" stroke="#06b6d4" stroke-width="2" />
  <path d="M 815 370 L 815 405" stroke="#06b6d4" stroke-width="2" />

  <!-- LAYER 3: CORE APPLICATION SERVICES -->
  <rect x="50" y="410" width="900" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="410" width="180" height="28" rx="6" fill="#06b6d4" />
  <text x="62" y="429" fill="#ffffff" font-size="12" font-weight="700">3. APPLICATION CORE</text>

  <g transform="translate(70, 450)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">OTP Auth Service</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">SHA-256, 5m Exp, Cooldown</text>
  </g>
  <g transform="translate(280, 450)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Email Dispatcher</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">Brevo API v3 &amp; Outbox</text>
  </g>
  <g transform="translate(490, 450)">
    <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">SLA &amp; Audit Engine</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">Deadline Tracking &amp; Logs</text>
  </g>
  <g transform="translate(700, 450)">
    <rect width="230" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Hardware Purchase Linker</text>
    <text x="16" y="40" fill="#94a3b8" font-size="11">Orders &amp; Warranty Validation</text>
  </g>

  <!-- Connection Arrows Down -->
  <path d="M 280 520 L 280 555" stroke="#10b981" stroke-width="2" />
  <path d="M 600 520 L 600 555" stroke="#10b981" stroke-width="2" />

  <!-- LAYER 4: DATA & INTEGRATION TIER -->
  <rect x="50" y="560" width="900" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="560" width="180" height="28" rx="6" fill="#10b981" />
  <text x="62" y="579" fill="#ffffff" font-size="12" font-weight="700">4. PERSISTENCE &amp; CLOUD</text>

  <g transform="translate(70, 595)">
    <rect width="260" height="45" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="22" fill="#f8fafc" font-size="13" font-weight="700">SQLite (WAL) / PostgreSQL 16</text>
    <text x="16" y="36" fill="#94a3b8" font-size="11">SQLAlchemy 2.0 ORM &amp; Migrations</text>
  </g>
  <g transform="translate(360, 595)">
    <rect width="250" height="45" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="16" y="22" fill="#f8fafc" font-size="13" font-weight="600">Redis 7 Pub/Sub</text>
    <text x="16" y="36" fill="#94a3b8" font-size="11">Multi-instance WebSocket Sync</text>
  </g>
  <g transform="translate(640, 595)">
    <rect width="290" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="22" fill="#f8fafc" font-size="13" font-weight="700">Brevo REST API v3</text>
    <text x="16" y="36" fill="#94a3b8" font-size="11">HTTPS Transactional Email Delivery</text>
  </g>
</svg>
