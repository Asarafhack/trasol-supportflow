version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trasol_postgres
    restart: always
    environment:
      POSTGRES_USER: trasol_admin
      POSTGRES_PASSWORD: TrasolSecurePostgresPass2026!
      POSTGRES_DB: trasol_supportdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trasol_admin -d trasol_supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Real-time WebSockets & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: trasol_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trasol_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Trasol SupportDesk 360"
      COMPANY_NAME: "Trasol Technologies"
      DATABASE_URL: "postgresql://trasol_admin:TrasolSecurePostgresPass2026!@postgres:5432/trasol_supportdesk"
      SECRET_KEY: "trasol-secret-jwt-key-2026-supersecure-supportflow"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      OWNER_NOTIFICATION_EMAIL: "owner@trasol.tech"
      SUPPORT_INBOX_EMAIL: "support@trasol.tech"
      ENABLE_EMAIL_SIMULATION: "true"
      BREVO_API_KEY: ""
      FRONTEND_URL: "http://localhost:5173"
      BACKEND_URL: "http://localhost:8000"
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trasol_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
